services:
  # Bot Telegram (main.py)
  bot:
    container_name: telegramusic-bot
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENABLE_FLAC=${ENABLE_FLAC:-0}
    volumes:
      - type: bind
        source: ./local_resources/
        target: /tmp/local_resources/
        read_only: true
    restart: unless-stopped
    env_file:
      - token.env
    environment:
      - COOKIES_PATH=/tmp/local_resources/cookies.txt
    command: ["python", "-u", "main.py"]

  # API REST (uvicorn) pour app Flutter / LKM Player
  api:
    container_name: telegramusic-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENABLE_FLAC=${ENABLE_FLAC:-0}
    restart: unless-stopped
    env_file:
      - token.env
    ports:
      - "8000:8000"
    command: ["python", "-m", "uvicorn", "api.server:app", "--host", "0.0.0.0", "--port", "8000"]
