name: API CI

on:
  push:
    branches: [main, develop, monorepo]
    paths:
      - 'services/api/**'
  pull_request:
    paths:
      - 'services/api/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax
        run: python -m py_compile main.py && python -m py_compile api/server.py

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -f services/api/Dockerfile.api -t lkm-api ./services/api
          docker build -f services/api/Dockerfile.bot -t lkm-bot ./services/api
